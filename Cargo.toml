[package]
name = "qtp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust rewrite of the QTP quantitative trading core"
license = "LGPL-3.0-only"
repository = "https://github.com/drjiathu/QTP-Rust"
readme = "README.md"
publish = false

[lib]
name = "qtp_core"
path = "src/lib.rs"

[dependencies]
slotmap = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "warn"
panic = "warn"
unwrap_used = "deny"
